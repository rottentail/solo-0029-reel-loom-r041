# Single-instance, single-node deployment.
# The data directory is the only persistence boundary; never scale this
# service beyond one replica per volume (the instance lock enforces it).
services:
  reel-loom:
    image: reel-loom:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reel-loom
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LOOM_DATA: /data
      LOOM_HOST: 0.0.0.0
      LOOM_PORT: "8729"
      LOOM_WORKERS: "2"
      LOOM_SHUTDOWN_TIMEOUT: "30"
      LOOM_RENDER_TIMEOUT: "600"
    volumes:
      - reel_loom_data:/data
    ports:
      - "127.0.0.1:8729:8729"
    stop_signal: SIGTERM
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O - http://127.0.0.1:8729/loom/v1/health | grep -q '\"phase\": \"ready\"'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  reel_loom_data:
    name: reel_loom_data
